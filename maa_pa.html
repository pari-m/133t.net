<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50 km box NW of Chennai: multi-model precipitation</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root { --bg:#fafafa; --panel:#fff; --line:#e3e3e3; --text:#222; --muted:#777; --accent:#1f4e9c; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color:var(--text); background:var(--bg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:12px; }
  .wrap { display:grid; grid-template-columns: 290px 1fr; gap:16px; padding:16px; }
  aside, main section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  aside { align-self:start; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; }
  h3 { margin:12px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  h3:first-child { margin-top:0; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:12px; padding:4px 9px; border:1px solid #ccc; border-radius:14px;
           background:#fff; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  label.item { display:flex; align-items:center; gap:7px; padding:2px 0; cursor:pointer; user-select:none; }
  label.group { font-weight:600; margin-top:6px; }
  .sw { width:14px; height:4px; border-radius:2px; flex:none; }
  .sw.dash { background:none !important; border-top:2px dashed; height:0; }
  main { display:flex; flex-direction:column; gap:16px; min-width:0; }
  #chart { width:100%; height:560px; cursor:crosshair; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 8px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:right; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { color:var(--muted); font-weight:600; cursor:pointer; }
  tr.mean td { font-weight:700; }
  td .bar { display:inline-block; height:8px; border-radius:2px; vertical-align:middle; margin-right:6px; opacity:.75; }
  #rangeLabel { font-weight:600; }
  input[type=number] { width:64px; font:inherit; padding:2px 4px; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>50 km box NW of Chennai: multi-model precipitation</h1>
  <p id="sub"></p>
</header>
<div class="wrap">
  <aside>
    <h3>Quick select</h3>
    <div class="btns">
      <button data-bulk="all">All</button>
      <button data-bulk="none">None</button>
      <button data-bulk="det">Deterministic</button>
      <button data-bulk="ens">Ensembles</button>
    </div>
    <h3>By centre</h3>
    <div class="btns" id="centres"></div>
    <h3>Models</h3>
    <div id="lists"></div>
    <h3>Display</h3>
    <label class="item"><input type="radio" name="ensmode" value="band" checked> Ensemble median + 10–90% band</label>
    <label class="item"><input type="radio" name="ensmode" value="members"> Ensemble: all members</label>
    <label class="item"><input type="checkbox" id="showMean" checked> Mean of selected deterministic</label>
  </aside>

  <main>
    <section>
      <div class="row">
        <strong>Select period:</strong>
        <div class="btns" id="days"></div>
      </div>
      <p class="hint">Or drag horizontally across the chart to select any period. Hover for values.</p>
      <div id="chart"></div>
    </section>
    <section>
      <div class="row">
        <span>Rain between <span id="rangeLabel">—</span></span>
        <span style="margin-left:auto">Ensemble chance of more than
          <input type="number" id="thr" value="50" min="0" step="5"> mm</span>
      </div>
      <table id="tbl"><thead></thead><tbody></tbody></table>
      <p class="note" id="tblNote"></p>
    </section>
  </main>
</div>

    rows.push({ name: s.label, colour: s.colour, type: 'Deterministic', val: r.s, full: r.full });
  }
  for (const s of sel('ensemble')) {
    const sums = s.members.map(m => sumRange(m, a, b));
    const full = sums.filter(r => r.full).map(r => r.s).sort((x, y) => x - y);
    const use = full.length ? full : sums.map(r => r.s).sort((x, y) => x - y);
    if (!full.length) partial = true;
    rows.push({ name: s.label, colour: s.colour, type: `Ensemble (${s.members.length})`,
                val: pct(use, .5), p10: pct(use, .1), p90: pct(use, .9),
                prob: 100 * use.filter(v => v > thr).length / use.length, full: full.length > 0 });
  }
  if (dets.length > 1 && showMean) {
    const r = sumRange(meanIncrements(dets), a, b);
    rows.push({ name: `Mean of ${dets.length} deterministic`, colour: '#000000', type: 'Mean',
                val: r.s, full: r.full, mean: true });
  }
  const key = sortKey;
  rows.sort((x, y) => key === 'name' ? x.name.localeCompare(y.name) : (y[key] ?? -1) - (x[key] ?? -1));
  const max = Math.max(1, ...rows.map(r => r.p90 ?? r.val ?? 0));
  const f0 = v => v == null ? '' : v.toFixed(v < 10 ? 1 : 0);
  thead.innerHTML = `<tr><th data-k="name">Model</th><th>Type</th><th data-k="val">Rain (mm)</th>
    <th data-k="p10">Ens P10</th><th data-k="p90">Ens P90</th><th data-k="prob">P(&gt;${thr} mm)</th></tr>`;
  tbody.innerHTML = rows.map(r => `<tr class="${r.mean ? 'mean' : ''}">
    <td><span class="bar" style="width:${Math.round(80 * (r.val || 0) / max)}px;background:${r.colour}"></span>${r.name}${r.full ? '' : ' †'}</td>
    <td>${r.type}</td><td>${f0(r.val)}</td><td>${f0(r.p10)}</td><td>${f0(r.p90)}</td>
    <td>${r.prob == null ? '' : r.prob.toFixed(0) + '%'}</td></tr>`).join('');
  thead.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { sortKey = th.dataset.k; table(); });
  note.textContent = (partial ? '† model data ends before the end of the selected period, so its total is incomplete. ' : '') +
    'Ensemble "Rain" is the median member. Click a column header to sort.';
}
document.getElementById('thr').oninput = table;

// ---------- model pickers ----------
function sync() {
  document.querySelectorAll('input[data-model]').forEach(cb => cb.checked = selected.has(cb.dataset.model));
  for (const type of ['deterministic', 'ensemble']) {
    const g = document.querySelector(`input[data-group="${type}"]`); if (!g) continue;
    const all = D.series.filter(s => s.type === type), n = all.filter(s => selected.has(s.label)).length;
    g.checked = n === all.length; g.indeterminate = n > 0 && n < all.length;
  }
  document.querySelectorAll('#centres button').forEach(b => {
    const all = D.series.filter(s => s.centre === b.dataset.centre);
    b.classList.toggle('on', all.every(s => selected.has(s.label)));
  });
  draw(); table();
}
(function buildPickers() {
  const lists = document.getElementById('lists');
  for (const [type, title] of [['deterministic', 'Deterministic'], ['ensemble', 'Ensembles']]) {
    const items = D.series.filter(s => s.type === type); if (!items.length) continue;
    const g = document.createElement('label'); g.className = 'item group';
    g.innerHTML = `<input type="checkbox" data-group="${type}"> ${title} (${items.length})`;
    g.querySelector('input').onchange = e => {
      items.forEach(s => e.target.checked ? selected.add(s.label) : selected.delete(s.label)); sync();
    };
    lists.appendChild(g);
    for (const s of items) {
      const l = document.createElement('label'); l.className = 'item';
      l.style.paddingLeft = '18px';
      l.innerHTML = `<input type="checkbox" data-model="${s.label}">
        <span class="sw ${type === 'ensemble' ? 'dash' : ''}" style="background:${s.colour};border-color:${s.colour}"></span>${s.label}`;
      l.querySelector('input').onchange = e => {
        e.target.checked ? selected.add(s.label) : selected.delete(s.label); sync();
      };
      lists.appendChild(l);
    }
  }
  const cbox = document.getElementById('centres');
  for (const c of [...new Set(D.series.map(s => s.centre))]) {
    const b = document.createElement('button'); b.textContent = c; b.dataset.centre = c;
    b.onclick = () => {
      const all = D.series.filter(s => s.centre === c);
      const on = all.every(s => selected.has(s.label));
      all.forEach(s => on ? selected.delete(s.label) : selected.add(s.label)); sync();
    };
    cbox.appendChild(b);
  }
  document.querySelectorAll('[data-bulk]').forEach(b => b.onclick = () => {
    selected.clear();
    const k = b.dataset.bulk;
    D.series.forEach(s => {
      if (k === 'all' || (k === 'det' && s.type === 'deterministic') || (k === 'ens' && s.type === 'ensemble'))
        selected.add(s.label);
    });
    sync();
  });
  document.querySelectorAll('input[name=ensmode]').forEach(r => r.onchange = () => { ensMode = r.value; draw(); });
  document.getElementById('showMean').onchange = e => { showMean = e.target.checked; sync(); };
})();

range = [T0, T[N - 1]];
sync();
setRange(range);
</script>
